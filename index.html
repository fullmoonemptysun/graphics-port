<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Graphic Design Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }
    header {
      background-color: #111;
      color: white;
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.03);
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      background-color: #111;
      color: white;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Graphic Design Work</h1>
    <p>A collection of designs I'm proud of</p>
  </header>

  <main>
    <section class="gallery">
      <img src="img1.jpg" alt="Design 1">
      <img src="img2.jpg" alt="Design 2">
      <img src="img3.jpg" alt="Design 3">
      <img src="img4.jpg" alt="Design 4">
   
      <!-- Add more images as needed -->
    </section>
  </main>

  <footer>
    &copy; 2025 Vinnie Kumar. All rights reserved.
  </footer>
</body>
</html>
